server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeçalhos de segurança. Ficam no nível do server de propósito: um add_header dentro de
    # um location apagaria estes. Por isso o cache usa `expires` (que não é add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # O app só carrega recursos do próprio domínio. data: e blob: são necessários para a logo
    # enviada pelo usuário e para renderizar o SVG do QR em canvas (PNG/PDF/teste de leitura).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Arquivos com hash no nome (Vite): cache de 1 ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Verificação de saúde para o Docker/Portainer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Tag do Google Search Console: o placeholder <!--GSC_VERIFICATION--> do index.html é trocado
    # em tempo de execução por ${GSC_META_TAG} (montada a partir de GOOGLE_SITE_VERIFICATION no
    # script docker/15-gsc-meta.envsh). Sem a variável, o placeholder some e nada é exposto.
    sub_filter '<!--GSC_VERIFICATION-->' '${GSC_META_TAG}';
    sub_filter_once on;

    # Nada de arquivos ocultos (.git, .env etc.).
    location ~ /\. {
        deny all;
    }

    # index.html nunca em cache: é ele que aponta para os arquivos novos a cada deploy.
    location = /index.html {
        expires -1;
    }

    # SPA: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
